
set -g prefix2 C-s

bind e if-shell "tmux list-windows | grep -q 'exec'" "select-window -t exec" "new-window -n exec"
bind r if-shell "tmux list-windows | grep -q 'run'" "select-window -t run" "new-window -n run"
bind c if-shell "tmux list-windows | grep -q 'client'" "select-window -t client" "new-window -n client"
bind s if-shell "tmux list-windows | grep -q 'server'" "select-window -t server" "new-window -n server"
bind t if-shell "tmux list-windows | grep -q 'testing'" "select-window -t testing" "new-window -n testing"

bind C command-prompt -p "new window:" "new-window -n '%%'"
bind W choose-window

bind w command-prompt -p "Window name:" "new-window -Ad -n '%%' \; select-window -t '%%'"



