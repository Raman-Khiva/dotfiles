set -g prefix2 C-s


bind e select-window -t exec
bind r select-window -t run
bind c select-window -t client
bind s select-window -t server
bind t select-window -t testing

bind C command-prompt -p "new window:" "new-window -n '%%'"
bind W choose-window

bind w command-prompt -p "Window name:" "select-window -t '%%'"
